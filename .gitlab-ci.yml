# =========================================================
# GitLab CI/CD Pipeline for PHP Application (VM Deployment)
# =========================================================


# =========================================================
# Global Variables
# =========================================================
variables:
  # Deployment Configuration
  STAGING_PORT: "8080"                           # Port exposed by web server (Apache/Nginx default port)
  DOC_ROOT: "/home/rp_3_0/"                    # Apache web root path
  DEPLOYED_URL: "http://${STAGING_VM}:${STAGING_PORT}"   # Public URL for deployed application
  LOAD_TEST_URL: "http://${STAGING_VM}:${STAGING_PORT}"  # Base URL used for performance/load tests

  # Load Test Configuration
  LOAD_TEST_USERNAME: "cloudsupport-wb@nic.in" # Username for load test authentication
  LOAD_TEST_PASSWORD: "admin@wbgit"            # Password for load test authentication
  LOAD_TEST_VIRTUAL_USERS: "500"               # Number of virtual users to simulate in load test
  LOAD_TEST_DURATION: "1m"                     # Duration of load test (e.g., 1 minute)
  LOAD_TEST_P95_THRESHOLD: "10000"             # Max acceptable 95th percentile response time (in ms)

  # API Test Parameters
  API_ITERATION_COUNT: "1000"                  # Number of times each API test case should run

  # PHP Runtime / Reporting
  PHP_MEMORY_LIMIT: "1024M"                    # Memory limit for PHP processes during analysis/tests
  REPORT_DIR: "reports"                        # Directory to store generated reports (linting, tests, etc.)
  


# ======================================================
# Stages - Execution Order (as per predefined pipeline)
# ======================================================
stages:
  - security_precheck      # 1. Detect secrets & vulnerable dependencies
  - code_quality           # 2. Ensure code quality & maintainability
  - deploy                 # 3. Deploy to staging
  - dast                   # 4. Runtime security testing (DAST)
  - performance_test       # 5. Load & performance testing
  - api_test               # 6. API correctness testing
  - observability          # 7. Monitoring & logging stack


# ======================================================
# Includes - GitLab Default Templates
# ======================================================
include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml


# ======================================================
# 1. Security Precheck
# ======================================================

# 🔐 Secret Detection
# Runs GitLab’s built-in secret detection to scan for accidentally
# committed sensitive information (API keys, tokens, passwords, etc.)
# This job is manual so that it can be triggered when required.
secret_detection:
  stage: security_precheck
  tags: [gitlabwb-php-docker-154]
  when: manual

# 🛡️ OWASP Dependency Check
# Runs OWASP Dependency-Check to identify known vulnerabilities (CVEs)
# in project dependencies. Generates both HTML and JSON reports.
# - Scans the entire project directory
# - Fails the pipeline only if CVSS score ≥ 10 (set high to avoid false positives)
# - Reports are stored as artifacts for 1 week
# - Marked as "allow_failure" so pipeline does not block critical builds
# - Triggered manually by developers/security reviewers
owasp_dependency_check:
  stage: security_precheck
  image:
    name: registry.gitlab.com/gitlab-ci-utils/docker-dependency-check:latest
    entrypoint: [""]
  script:
    - /usr/share/dependency-check/bin/dependency-check.sh --scan "./" --format ALL --project "$CI_PROJECT_NAME" --failOnCVSS 100
  artifacts:
    paths: [dependency-check-report.html, dependency-check-report.json]
    when: always
    expire_in: 1 week
  allow_failure: true
  when: manual
  tags: [gitlabwb-php-docker-154]



