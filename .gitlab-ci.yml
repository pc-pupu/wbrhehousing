# ======================================================
# 3. Deploy to Staging
# ======================================================

# 🚀 Deploys the PHP application to the staging server
# - Copies project files from runner to $STAGING_VM at $DOC_ROOT
# - Clears Laravel cache and regenerates Composer autoload
# - Fixes file permissions for Apache
# - Restricted to `main` branch to prevent accidental deployments
deploy_app:
  stage: deploy
  script:
    - echo $DOC_ROOT
    - echo $STAGING_VM
    - echo "Copying project to remote server..."
    # Copy project files from runner to remote server
    - scp -r ./* $SSH_USERID@$STAGING_VM:$DOC_ROOT
    # SSH into remote server and run deployment tasks
    - ssh $SSH_USERID@$STAGING_VM "
        cd $DOC_ROOT  &&
        php artisan cache:clear &&
        composer dumpautoload &&
        chown -R apache:apache . &&
        chmod -R 755 .
      "
    - echo "Application Deployed successfully"
  # when: manual
  only: [main]
  tags: [gitlabwb-php-shell-154]


# ======================================================
# 4. Dynamic Application Security Testing (DAST)
# ======================================================

# 🕷️ OWASP ZAP Scan
# - Runs OWASP ZAP full scan against the deployed application
# - Uses `$DEPLOYED_URL` as the scan target
# - Outputs an HTML vulnerability report (artifact)
# - Runs manually on main branch only to avoid unnecessary scans
# - `allow_failure: true` so findings do not block pipeline execution
zap_scan:
  stage: dast
  image: zaproxy/zap-stable
  before_script:
    # Create working directory for ZAP inside container
    - mkdir -p /zap/wrk
  script:
    # Run ZAP full scan with:
    # -m 1 → Max one attack per URL (faster scan)
    # -d   → Debug mode
    # -I   → Ignore SSL certificate warnings
    # -r   → Generate HTML report
    - zap-full-scan.py -t $DEPLOYED_URL -m 1 -d -I -r zap-report.html
  artifacts:
    paths: [zap-report.html]
    when: always
  allow_failure: true
  only: [main]
  when: manual
  tags: [gitlabwb-php-docker-154]


# 🛡️ Nikto Web Server Scan
# - Runs Nikto (open-source web server scanner) against deployed app
# - Executes scan in a remote staging VM (via SSH + Docker run)
# - Scan parameters:
#   • Output in HTML format
#   • Max runtime = 600s (10 min)
#   • Evasion mode enabled (-evasion 1)
#   • No DNS lookup, no interactive prompts
# - Retrieves report back via SCP and stores as artifact
# - Runs manually on main branch only, does not block pipeline
nikto_scan:
  stage: dast
  script:
    # Connect to staging VM and run Nikto in Docker
    - ssh $SSH_USERID@$STAGING_VM "
        mkdir -p /tmp/nikto_scan &&
        docker pull hysnsec/nikto &&
        docker run --rm --network=host -v /tmp/nikto_scan:/tmp hysnsec/nikto \
          -h $DEPLOYED_URL -o /tmp/nikto-output.html -Format htm -maxtime 600 -evasion 1 -nolookup -nointeractive
      "
    # Copy report from remote staging VM to local job workspace
    - scp $SSH_USERID@$STAGING_VM:/tmp/nikto_scan/nikto-output.html .
  artifacts:
    paths: [nikto-output.html]
    when: always
    expire_in: 1 week
  allow_failure: true
  only: [main]
  when: manual
  tags: [gitlabwb-php-docker-154]

# ======================================================
# 5. Performance Testing (k6)
# ======================================================

# ⚡ K6 Load / Performance Test
# - Runs performance tests using Grafana k6 against the deployed application
# - Test script is defined in `common_config/performance-test.js`
# - Uses `--insecure-skip-tls-verify` to bypass TLS certificate errors (if self-signed/invalid certs)
# - Exports raw results in JSON format for further analysis
# - Intended to generate summary reports (e.g., summary.html) for visualization
# - Artifacts are kept for 1 week for review
# - Runs manually and marked as allow_failure so it won’t block pipeline
k6_loadtest:
  stage: performance_test
  image:
    name: grafana/k6:latest
    entrypoint: [""]
  script:
    # Run k6 performance test
    - k6 run --insecure-skip-tls-verify --out json=k6-results.json common_config/performance-test.js
  artifacts:
    paths: [k6-results.json, summary.html]
    expire_in: 1 week
  allow_failure: true
  when: manual
  tags: [gitlabwb-php-docker-154]



# ======================================================
# 6. API Testing (Postman/Newman)
# ======================================================

# 🔗 Postman API Tests (via Newman)
# - Executes API tests using Postman collection with Newman CLI
# - Collection file: common_config/PostmanCrowd.postman_collection.json
# - Runs multiple iterations (count controlled by $API_ITERATION_COUNT)
# - Generates detailed HTML report using htmlextra reporter
# - Report is stored as an artifact (postman_report.html) for review
# - Restricted to `main` branch; 
# - Runs manually and marked as allow_failure so it won’t block pipeline
postman_api_test:
  stage: api_test
  image:
    name: postman/newman
    entrypoint: [""]
  script:
    # Install Newman HTML reporter
    - npm install -g newman-reporter-htmlextra
    # Run Postman tests with CLI + HTML report
    - newman run common_config/PostmanCrowd.postman_collection.json \
        -n $API_ITERATION_COUNT \
        --reporters cli,htmlextra \
        --reporter-htmlextra-export postman_report.html
  artifacts:
    paths: [postman_report.html]
  allow_failure: true
  only: [main]
  tags: [gitlabwb-php-docker-154]
  when: manual



# ======================================================
# 7. Observability (Grafana + Prometheus + Loki)
# ======================================================

# 📊 Observability Stack Deployment / Health Check
# - Ensures the observability stack (Loki, Prometheus, Node Exporter, Grafana, Promtail) 
#   is running on the staging VM
# - Copies monitoring configuration files (`loki-config.yaml`, `prometheus.yml`, etc.) 
#   from repo → remote staging server
# - Verifies if required containers are already running:
#     • If all running → skips restart
#     • If any missing/stopped → restarts stack via docker-compose
# - Runs only on `main` branch and triggered manually
# - Non-blocking job intended for DevOps/SRE visibility and reliability
observability_stack:
  stage: observability
  before_script:
    # Create target directory for observability configs on staging VM
    - ssh -o StrictHostKeyChecking=no $SSH_USERID@$STAGING_VM "mkdir -p ~/loki/"
    # Copy local observability config files to staging VM
    - scp -r common_config/observability/* "$SSH_USERID@$STAGING_VM:~/loki/"
  script:
    - |
      ssh -o StrictHostKeyChecking=no "$SSH_USERID@$STAGING_VM" '
        set -e
        cd ~/loki
        # Ensure config files are readable
        chmod 755 loki-config.yaml prometheus.yml
        # List of required observability containers
        REQUIRED_CONTAINERS="loki prometheus node-exporter grafana promtail"
        ALL_RUNNING=true
        # Check if all required containers are up & running
        for container in $REQUIRED_CONTAINERS; do
          if ! docker ps --filter "name=^/${container}$" --filter "status=running" \
              --format "{{.Names}}" | grep -q "^${container}$"; then
            ALL_RUNNING=false
            break
          fi
        done
        if [ "$ALL_RUNNING" = true ]; then
          echo "✅ All observability containers are running. Skipping restart."
        else
          echo "❌ Restarting observability stack..."
          docker-compose down --volumes --remove-orphans
          docker-compose -f docker-compose.yaml up --build -d
        fi
      '
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  when: manual
  tags: [gitlabwb-php-shell-154]